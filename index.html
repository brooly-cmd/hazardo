<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazardo</title>
<meta name="description" content="Hazardo, la roue qui choisit pour toi quand tu n'arrives pas à te décider.">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Mission 7 : comme une vraie app (icône, nom et plein écran sur l'écran d'accueil) -->
<link rel="manifest" href="manifest.webmanifest?v=7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hazardo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF6E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A0F2E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<canvas id="toile" aria-hidden="true"></canvas>

<div class="app">
  <header class="entete">
    <div class="marque"><img src="logo.svg" alt=""><h1>Hazardo</h1></div>
    <button class="jn" id="jn" type="button" aria-pressed="false" aria-label="Mode nuit"><i></i><b></b><b></b><b></b></button>
  </header>

  <!-- Écran 1 : Accueil -->
  <main class="ecran" id="ecran-accueil">
    <button class="pastille" id="nom-roue" type="button">
      <span id="nom-roue-texte">Repas</span> <span aria-hidden="true">▾</span>
    </button>
    <div class="scene">
      <div class="fleche" id="fleche" aria-hidden="true">
        <svg viewBox="0 0 46 52"><path d="M5 5h36L23 47z" fill="var(--accent)" stroke="var(--texte)" stroke-width="4" stroke-linejoin="round"/></svg>
      </div>
      <div class="penche" id="penche">
        <svg id="roue" viewBox="-110 -110 220 220" role="img"></svg>
        <div class="reflet"></div>
      </div>
    </div>
    <div class="aimant" id="aimant"><button class="btn-principal" id="tourne" type="button">Tourne !</button></div>
    <div class="trop-peu" id="trop-peu" hidden>
      <p>Ajoute au moins 2 choix pour faire tourner la roue.</p>
      <button class="btn-ajout" type="button" data-ouvre-liste>Ajouter des choix</button>
    </div>
    <button class="btn-lien" id="modifier" type="button" data-ouvre-liste>Modifier les choix</button>
  </main>

  <!-- Écran 3 : Modifier les choix -->
  <main class="ecran" id="ecran-liste" hidden>
    <button class="btn-lien" id="retour" type="button">← Retour à la roue</button>
    <h2 id="titre-liste" tabindex="-1"></h2>
    <form class="ajout" id="ajout" novalidate>
      <input id="nouveau" type="text" placeholder="Ajoute un choix…" aria-label="Nouveau choix"
        aria-describedby="erreur" autocomplete="off" enterkeyhint="done">
      <button class="btn-ajout" type="submit">Ajouter</button>
    </form>
    <p class="erreur" id="erreur" role="alert"></p>
    <div class="compteur">
      <p id="compteur"></p>
      <span class="ampoules" id="ampoules" aria-hidden="true"></span>
    </div>
    <p class="vide" id="vide" hidden>Ta roue est vide. Ajoute au moins 2 choix pour la faire tourner.</p>
    <ul class="choix" id="choix"></ul>
  </main>

  <!-- Écran 4 : Mes roues -->
  <main class="ecran" id="ecran-roues" hidden>
    <button class="btn-lien" id="retour-roues" type="button">← Retour à la roue</button>
    <h2 id="titre-roues" tabindex="-1">Mes roues</h2>
    <ul class="roues" id="roues"></ul>
    <p class="seule" id="seule" hidden>Il te faut au moins une roue.</p>
    <button class="btn-nouvelle" id="nouvelle" type="button">+ Nouvelle roue</button>
    <form class="ajout" id="form-nouvelle" novalidate hidden>
      <input id="nom-nouvelle" type="text" placeholder="Nom de la nouvelle roue" aria-label="Nom de la nouvelle roue"
        aria-describedby="erreur-roue" autocomplete="off" enterkeyhint="done">
      <button class="btn-ajout" type="submit">Créer</button>
    </form>
    <p class="erreur" id="erreur-roue" role="alert"></p>
    <p class="note">Tes roues sont gardées sur cet appareil seulement.</p>
  </main>
</div>

<!-- Écran 2 : Résultat (par-dessus la roue) -->
<div class="voile" id="ecran-resultat" hidden>
  <div class="ticket" role="dialog" aria-modal="true" aria-labelledby="gagnant">
    <p class="et">Et c'est…</p>
    <p class="gagnant" id="gagnant"></p>
    <div class="boutons">
      <button class="btn-principal" id="encore" type="button">Encore !</button>
      <button class="btn-lien" id="merci" type="button">Super, merci</button>
    </div>
  </div>
</div>

<!-- Confirmation de suppression (par-dessus « Mes roues ») -->
<div class="voile" id="ecran-supprimer" hidden>
  <div class="ticket" role="alertdialog" aria-modal="true" aria-labelledby="question-supprimer">
    <p class="question" id="question-supprimer"></p>
    <div class="boutons">
      <button class="btn-principal" id="oui-supprimer" type="button">Supprimer</button>
      <button class="btn-lien" id="non-supprimer" type="button">Annuler</button>
    </div>
  </div>
</div>

<script src="stockage.js?v=7"></script>
<script src="roue.js?v=7"></script>
<script src="effets.js?v=7"></script>
<script src="choix.js?v=7"></script>
<script src="roues.js?v=7"></script>
</body>
</html>
